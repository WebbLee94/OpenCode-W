appId: com.webb.opencode-w
productName: OpenCode-W
asar: true
asarUnpack: []
directories:
  output: dist
files:
  - dist-electron
  - dist/index.html
  - dist/assets/**/*
  - dist/brand/**/*
  - "!dist/mac-arm64"
  - "!dist/*.dmg"
  - "!dist/*.zip"
  - "!dist/*.blockmap"
  - "!dist/builder-effective-config.yaml"
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.ico
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  icon: build/icon.png
