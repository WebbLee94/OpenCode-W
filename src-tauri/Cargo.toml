[package]
name = "opencode-w"
version = "1.3.1"
description = "OpenCode-W - AI 编程工程工坊"
authors = ["Webb Lee"]
license = "MIT"
repository = "https://github.com/WebbLee94/OpenCode-W"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["sync"] }
dirs = "5"
chrono = "0.4"
url = "2"
sha1 = "0.10"
hex = "0.4"
r2d2 = "0.8.10"
r2d2_sqlite = "0.25"
