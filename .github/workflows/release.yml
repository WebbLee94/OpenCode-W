name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon：macos-latest 本身就是 arm64，原生构建
          - platform: darwin-aarch64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            bundle-arch: arm64
          # Intel：在 arm64 runner 上交叉编译。GitHub 已下线免费的标准 Intel runner
          # （macos-13 已退役，Intel 镜像只剩 macos-15-intel / macos-26-intel 这类
          # 需要单独开通的 larger runner），因此不依赖 Intel runner 的可用性。
          - platform: darwin-x86_64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            bundle-arch: x86_64
          - platform: windows-x86_64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundle-arch: ''
          - platform: linux-x86_64
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            bundle-arch: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # 使用 --target 构建时产物落在 target/<triple>/release/bundle，而不是 target/release/bundle
      BUNDLE_ROOT: src-tauri/target/${{ matrix.rust-target }}/release/bundle
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release version matches tag (tag release only)
        # 打包前的版本一致性守卫：tag 必须与 src-tauri/tauri.conf.json、
        # src-tauri/Cargo.toml、package.json 三处 version 完全一致。
        # 否则清单会写 tag 的版本、用户装的却是另一版，updater 每次检查都判定
        # 「有新版本」-> 无限更新循环。放在依赖安装之前，版本写错时几十秒内失败，
        # 不必等整套构建跑完。
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Install dependencies
        run: npm ci

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          # 交叉编译目标的标准库：x86_64-apple-darwin 需要额外安装
          targets: ${{ matrix.rust-target }}

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Release scripts self-test
        # 清单生成 / 清单校验 / 版本守卫的回归自测（零依赖，见 scripts/selftest-latest-json.mjs）
        run: npm run release:selftest

      - name: Enable updater artifacts (tag release only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.bundle.createUpdaterArtifacts=true;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"

      - name: Build frontend
        run: npm run build

      - name: Build (Tauri)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.rust-target }}

      - name: Verify macOS bundle architecture
        if: matrix.bundle-arch != ''
        run: |
          set -euo pipefail
          macos_dir="$BUNDLE_ROOT/macos"
          if [ ! -d "$macos_dir" ]; then
            echo "::error::未找到 macOS 产物目录 $macos_dir"
            exit 1
          fi
          app_dir="$(find "$macos_dir" -maxdepth 1 -name '*.app' -type d | head -n 1)"
          if [ -z "$app_dir" ]; then
            echo "::error::$macos_dir 下没有 .app 产物"
            exit 1
          fi
          if [ ! -d "$app_dir/Contents/MacOS" ]; then
            echo "::error::.app 产物结构异常，缺少 Contents/MacOS: $app_dir"
            exit 1
          fi
          exe="$(find "$app_dir/Contents/MacOS" -maxdepth 1 -type f | head -n 1)"
          if [ -z "$exe" ]; then
            echo "::error::.app 产物内没有可执行文件: $app_dir"
            exit 1
          fi
          archs="$(lipo -archs "$exe")"
          echo "bundle executable: $exe"
          echo "lipo -archs: $archs"
          # 精确比对架构集合（逗号/空格分隔后逐项比较），不能用子串匹配：
          # 子串匹配会让 universal binary（x86_64 arm64）在单架构条目下误判为通过，
          # 也会让「Intel 交叉编译静默产出 arm64」这种真实故障漏过。
          normalize_archs() {
            printf '%s\n' "$1" | tr ',' '\n' | tr ' ' '\n' | awk 'NF {print}' | sort -u | tr '\n' ' ' | sed 's/[[:space:]]*$//'
          }
          expected_archs="$(normalize_archs "${{ matrix.bundle-arch }}")"
          actual_archs="$(normalize_archs "$archs")"
          if [ "$expected_archs" != "$actual_archs" ]; then
            echo "::error::架构不符：期望 [$expected_archs]，实际 [$actual_archs]"
            exit 1
          fi
          echo "✓ 架构校验通过：[$actual_archs]"

      - name: Normalize macOS updater artifact name
        if: matrix.bundle-arch != ''
        env:
          PLATFORM: ${{ matrix.platform }}
          UPDATER_ENABLED: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          # macOS 的 updater 产物名固定是 <product>.app.tar.gz，不含架构信息，
          # arm64 与 x86_64 完全同名。直接作为 Release 资产上传会互相覆盖，
          # 因此按平台 key 重命名，保证每个平台在 Release 里有唯一资产。
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          macos_dir="$BUNDLE_ROOT/macos"
          shopt -s nullglob
          renamed=0
          for f in "$macos_dir"/*.app.tar.gz.sig; do
            mv "$f" "${f%.app.tar.gz.sig}_${version}_${PLATFORM}.app.tar.gz.sig"
            renamed=$((renamed + 1))
          done
          for f in "$macos_dir"/*.app.tar.gz; do
            mv "$f" "${f%.app.tar.gz}_${version}_${PLATFORM}.app.tar.gz"
            renamed=$((renamed + 1))
          done
          if [ "$renamed" -eq 0 ] && [ "$UPDATER_ENABLED" = "true" ]; then
            echo "::error::$macos_dir 下没有 *.app.tar.gz，无法生成平台唯一的资产名"
            exit 1
          fi
          ls -1 "$macos_dir"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # 产物按平台 key 分目录上传，release job 据此确定 latest.json 的平台 key
          name: ${{ matrix.platform }}
          path: |
            ${{ env.BUNDLE_ROOT }}/**/*.dmg
            ${{ env.BUNDLE_ROOT }}/**/*.app
            ${{ env.BUNDLE_ROOT }}/**/*.exe
            ${{ env.BUNDLE_ROOT }}/**/*.msi
            ${{ env.BUNDLE_ROOT }}/**/*.zip
            ${{ env.BUNDLE_ROOT }}/**/*.AppImage
            ${{ env.BUNDLE_ROOT }}/**/*.deb
            ${{ env.BUNDLE_ROOT }}/**/*.tar.gz
            ${{ env.BUNDLE_ROOT }}/**/*.sig
            # deb 内部的 control/data tarball 不是给用户下载的安装包，别混进 Release 资产
            !${{ env.BUNDLE_ROOT }}/**/control.tar.gz
            !${{ env.BUNDLE_ROOT }}/**/data.tar.gz
            # `.rpm` 是 tauri-bundler 的一等 Linux bundle target（Deb / Rpm / AppImage 并列），
            # 但本次上传范围里不含 `.rpm`，单独留下它的签名会变成没有对应产物的孤儿签名，
            # 故一并排除
            !${{ env.BUNDLE_ROOT }}/**/*.rpm.sig
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release version matches tag
        # 生成清单前的版本一致性守卫：tag 必须与 src-tauri/tauri.conf.json、
        # src-tauri/Cargo.toml、package.json 三处 version 完全一致。
        # 清单里的 version 取自 tag，而打进二进制的版本取自 tauri.conf.json，
        # 两者不一致时 updater 会一直判定「有新版本」，装完却什么也没变，
        # 形成无限更新循环 —— 所以这里直接失败，不让 Release 被创建。
        run: node scripts/verify-release-version.mjs "${{ github.ref_name }}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate latest.json
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/generate-latest-json.mjs "${{ github.ref_name }}" artifacts

      - name: Verify latest.json
        run: node scripts/verify-latest-json.mjs latest.json "${{ github.ref_name }}"

      - name: Assert excluded artifacts are absent
        run: |
          set -euo pipefail
          # 兜底断言：deb 内部的 control/data tarball 与 `.rpm.sig` 在 build job 的
          # upload-artifact 阶段就已被排除（@actions/glob 支持 `!` 负向模式），
          # download-artifact 拿到的目录里本就不该出现它们。这里再确认一次，
          # 避免将来有人扩大上传范围时把内部 tarball / 孤儿签名带进 Release。
          found="$(find artifacts -type f \( -name 'control.tar.gz' -o -name 'data.tar.gz' -o -name '*.rpm.sig' \) -print)"
          if [ -n "$found" ]; then
            echo "::error::Release 资产里出现了本应排除的文件："
            echo "$found"
            exit 1
          fi
          echo "✓ 未发现需要排除的产物"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.zip
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.tar.gz
            artifacts/**/*.sig
            latest.json
            # 说明：这里不能写 `!artifacts/**/control.tar.gz` 之类的排除。
            # `softprops/action-gh-release` 的 `files` 是把每条 pattern 单独 glob
            # 之后拼接（其内置 glob 的 Pattern 显式 nonegate），`!` 不会被解释成取反，
            # 写了也是无效代码、只会制造「已经兜底」的假象。
            # 真正的排除发生在 build job 的 upload-artifact 阶段：那里的
            # `@actions/glob` 支持 `!` 负向模式，deb 内部的 control/data tarball
            # 与 `.rpm.sig` 已经被排除，因此下载到的目录里根本不存在这些文件。
            # 上面的「Assert excluded artifacts are absent」步骤会对这个前提做真实断言。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
