<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP 由 Tauri 通过 tauri.conf.json 的 app.security.csp 字段统一管理。
      不在 index.html 中硬编码 CSP meta —— 那会与 Tauri 注入的 CSP 头叠加，
      且 'self' 语义在 Tauri 自定义协议（tauri://）下行为不一致，
      还会阻止 Vite 开发模式注入的 React Refresh inline script。
    -->
    <title></title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
